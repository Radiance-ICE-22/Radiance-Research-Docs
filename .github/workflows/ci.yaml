name: Build and Test

on:
  pull_request:
    branches:
      - v4
  push:
    branches:
      - v4
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
            fetch-depth: 0
            lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Clean Install Dependencies
        run: npm ci

      - name: Ensure Quartz builds
        run: npx quartz build

      - name: Ensure Test passes
        run: npm test